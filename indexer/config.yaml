name: STAMP_Indexer
description: Indexer for STAMP Provenance Registry on Monad Testnet
field_selection:
  transaction_fields:
    - hash
chains:
  - id: 10143
    rpc:
      - url: https://testnet-rpc.monad.xyz
        for: fallback
        # Monad's public RPC rejects eth_getLogs over 100 blocks. HyperSync needs ENVIO_API_TOKEN in indexer/.env.
        initial_block_interval: 100
        interval_ceiling: 100
    start_block: 70443261
    contracts:
      - name: ProvenanceRegistry
        address:
          - "0x4A934ACF37787E5A219Fd0FC67617929cbA1509f"
        handler: src/EventHandlers.ts
        events:
          - event: Stamped(string indexed id, string contentHash, string band0, string band1, string band2, string band3, string band4, string band5, string band6, string band7, string model, address indexed agent, address indexed creator, uint8 kind)
